<section id="skills" *ngIf="skills.length">
  <div class="container">

    <div class="section-title">
      <h2>My Arsenal</h2>
      <p class="subtitle">Technologies I use to build the web</p>
    </div>

    <div class="skills-cloud">
      <!-- كل كاتيجوري هيبقى بلوك -->
      <div class="skill-group" *ngFor="let skill of skills">
        <h3 class="group-title">{{ skill.title }}</h3>
        <div class="tags-wrapper">
          <span class="skill-tag" *ngFor="let item of skill.items">
            {{ item }}
          </span>
        </div>
      </div>
    </div>

  </div>
</section>
