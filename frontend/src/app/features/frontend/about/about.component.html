<section id="about" class="about-section" *ngIf="about">
  <div class="container">

    <!-- عنوان القسم -->
    <div class="section-title">
      <h2>About Me</h2>
      <div class="underline"></div>
    </div>

    <!-- المحتوى -->
    <div class="about-content">

      <!-- الجزء النصي -->
      <div class="about-text">
        <h3>{{ about.title }}</h3>
        <p>{{ about.bio }}</p>

        <!-- ممكن تضيفي هنا زر تحميل السيرة الذاتية لو حبيتي -->
        <!-- <a href="#" class="btn-download">Download CV</a> -->
      </div>

      <!-- الصورة -->
      <div class="about-image">
        <div class="image-wrapper">
          <img [src]="about.photoUrl" alt="Aya Anwar" />
        </div>
      </div>

    </div>
  </div>
</section>
