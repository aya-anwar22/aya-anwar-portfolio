<section id="certifications" class="certifications-section">
  <div class="container">

    <div class="section-header">
      <span class="section-subtitle">Credentials</span>
      <h2 class="section-title">Certificates & Training</h2>
      <div class="underline"></div>
    </div>

    <!-- زرار الـ CV -->
    <div class="cv-container">
      <a [href]="cvUrl" target="_blank" rel="noopener noreferrer" class="cv-btn">
        <i class="fas fa-file-pdf"></i> View My CV
      </a>
    </div>

    <!-- شبكة الشهادات -->
    <div class="certificates-grid">
      <a class="certificate-card" *ngFor="let cert of certificates" [href]="cert.imageUrl" target="_blank">

        <!-- صورة الشهادة -->
        <div class="cert-image-wrapper">
          <img [src]="cert.imageUrl" [alt]="cert.title">
          <div class="image-overlay">
            <i class="fas fa-search-plus"></i> View Certificate
          </div>
        </div>

        <!-- تفاصيل الشهادة -->
        <div class="cert-info">
          <h3>{{ cert.title }}</h3>
          <div class="cert-meta">
            <span class="issuer">{{ cert.issuer }}</span>
            <span class="date">{{ cert.date }}</span>
          </div>
          <p>{{ cert.description }}</p>
        </div>

      </a>
    </div>

  </div>
</section>
