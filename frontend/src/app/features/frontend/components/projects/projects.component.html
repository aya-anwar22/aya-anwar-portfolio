<section id="projects" class="projects-section">
  <div class="container">

    <div class="section-header">
      <span class="section-subtitle">Portfolio</span>
      <h2 class="section-title">Featured Projects</h2>
      <div class="underline"></div>
    </div>

    <!-- لاحظي: بنلف على displayedProjects -->
    <div class="projects-grid" *ngIf="displayedProjects.length">

      <div class="project-card" *ngFor="let project of displayedProjects">

        <div class="card-top-bar"></div>

        <div class="project-image">
          <img [src]="project.image" [alt]="project.title" />
          <div class="image-overlay">
            <a *ngIf="project.githubLink?.length" [href]="project.githubLink[0]" target="_blank" class="overlay-link" title="Source Code">
              <i class="fab fa-github"></i>
            </a>
            <a *ngIf="project.liveDemo" [href]="project.liveDemo" target="_blank" class="overlay-link" title="Live Demo">
              <i class="fas fa-external-link-alt"></i>
            </a>
          </div>
        </div>

        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>

          <div class="project-tech">
            <span class="tech-tag" *ngFor="let tech of project.techStack">{{ tech }}</span>
          </div>

          <div class="project-links">
            <a *ngIf="project.githubLink?.length" [href]="project.githubLink[0]" target="_blank">
              <i class="fab fa-github"></i> Source
            </a>
            <a *ngIf="project.liveDemo" [href]="project.liveDemo" target="_blank">
              <i class="fas fa-external-link-alt"></i> Demo
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- زرار View All Projects -->
    <div class="view-all-container" *ngIf="hasMoreProjects">
      <a routerLink="/projects" class="view-all-btn">
        View All Projects
        <i class="fas fa-arrow-right"></i>
      </a>
    </div>

  </div>
</section>
